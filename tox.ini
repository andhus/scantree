[tox]
envlist = pre-commit,py{310,311,312,313,314}

[testenv]
deps =
    pytest
    pytest-cov
commands =
    pytest --cov=scantree --cov-report=xml --cov-report=term-missing --cov-config=.coveragerc {posargs:tests}

[testenv:pre-commit]
skip_install = true
deps = pre-commit
commands = pre-commit run --all-files --show-diff-on-failure

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
